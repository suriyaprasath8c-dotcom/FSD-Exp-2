<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Student Registration Form</h2>

      <form id="registrationForm" novalidate>
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" />
          <span id="nameError" class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="text" id="email" name="email" placeholder="Enter your email" />
          <span id="emailError" class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number:</label>
          <input type="text" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" />
          <span id="mobileError" class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter password" />
          <span id="passwordError" class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password:</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" />
          <span id="confirmPasswordError" class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" min="18" max="60" placeholder="Enter age" />
          <span id="ageError" class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="course">Course:</label>
          <select id="course" name="course">
            <option value="">-- Select Course --</option>
            <option value="JavaScript">JavaScript</option>
            <option value="NodeJS">Node.js</option>
            <option value="Python">Python</option>
          </select>
          <span id="courseError" class="error" aria-live="polite"></span>
        </div>

        <button type="submit">Register</button>
      </form>

      <p id="successMessage" class="success" aria-live="polite"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
